name: Validate NixOS Configuration

on:
  push:
    branches: [ main, master, copilot/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Validate flake
      run: |
        nix flake check --no-write-lock-file
    
    - name: Setup Cachix (optional)
      uses: cachix/cachix-action@v14
      with:
        name: nixos-openclaw
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      continue-on-error: true
    
    - name: Build system configuration
      run: |
        echo "Building NixOS system configuration..."
        nix build .#nixosConfigurations.openclaw-vm.config.system.build.toplevel -L --no-write-lock-file
        echo "✓ Configuration builds successfully!"
        
    - name: Show system info
      run: |
        nix eval .#nixosConfigurations.openclaw-vm.config.system.nixos.label --raw
        echo ""
        nix path-info .#nixosConfigurations.openclaw-vm.config.system.build.toplevel
